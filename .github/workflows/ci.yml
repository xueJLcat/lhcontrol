name: CI

on:
  workflow_call:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Test and Build on Windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'
          cache-dependency-path: |
            go.sum
            third_party/tinygo-bluetooth/go.sum

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Check Frontend
        working-directory: frontend
        run: npm run check

      - name: Test Frontend
        working-directory: frontend
        run: npm test

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Test Go
        run: go test ./...

      - name: Test Go with Race Detector
        run: go test -race ./...

      - name: Vet Go
        run: go vet ./...

      - name: Check Go Vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

      - name: Compile Patched Bluetooth Module
        working-directory: third_party/tinygo-bluetooth
        run: go test ./...

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Lint Workflows
        run: |
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          actionlint

      - name: Install NSIS
        shell: powershell
        run: |
          winget install --id NSIS.NSIS --version 3.12 --exact --silent --accept-package-agreements --accept-source-agreements
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify NSIS
        shell: powershell
        run: makensis /VERSION

      - name: Build Windows Application
        run: wails build -platform windows/amd64 -clean -nsis -trimpath

      - name: Verify Windows Artifacts
        shell: powershell
        run: |
          $files = @("build/bin/lhcontrol.exe", "build/bin/lhcontrol-amd64-installer.exe")
          foreach ($file in $files) {
            if (!(Test-Path $file) -or (Get-Item $file).Length -le 0) {
              throw "Required artifact is missing or empty: $file"
            }
          }

      - name: Verify Generated Files
        run: |
          git diff --check
          git diff --exit-code
