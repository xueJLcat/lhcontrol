name: Build and Release Artifacts

on:
  workflow_run:
    workflows: ["Release"]
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: release-artifacts-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  build:
    name: Build Windows App & Installer
    runs-on: windows-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    env:
      SIGNING_CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
      SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Check for Release Tag
        id: check_tag
        shell: bash
        run: |
          git fetch --tags
          TAG=$(git describe --tags --exact-match HEAD 2>/dev/null || echo "")
          if [ -z "$TAG" ]; then
            echo "No tag found on this commit. Skipping build."
            echo "skipped=true" >> $GITHUB_OUTPUT
          else
            echo "Found tag: $TAG"
            echo "skipped=false" >> $GITHUB_OUTPUT
            echo "tag_name=$TAG" >> $GITHUB_OUTPUT
          fi

      - name: Setup Go
        if: steps.check_tag.outputs.skipped == 'false'
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'

      - name: Setup Node.js
        if: steps.check_tag.outputs.skipped == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: '22.14.x'

      - name: Install Wails
        if: steps.check_tag.outputs.skipped == 'false'
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.13.0

      - name: Install NSIS
        if: steps.check_tag.outputs.skipped == 'false'
        shell: powershell
        run: |
          winget install --id NSIS.NSIS --version 3.12 --exact --silent --accept-package-agreements --accept-source-agreements
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Stamp Release Version
        if: steps.check_tag.outputs.skipped == 'false'
        shell: powershell
        run: |
          $version = "${{ steps.check_tag.outputs.tag_name }}".TrimStart("v")
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "Release tag is not a semantic version: $version"
          }
          $config = Get-Content wails.json -Raw | ConvertFrom-Json
          $config.info.productVersion = $version
          $config | ConvertTo-Json -Depth 10 | Set-Content wails.json -Encoding utf8

      - name: Build
        if: steps.check_tag.outputs.skipped == 'false'
        run: |
          makensis /VERSION
          wails build -platform windows/amd64 -clean -nsis -trimpath -ldflags "-s -w"

      - name: Sign Release Artifacts
        if: steps.check_tag.outputs.skipped == 'false' && env.SIGNING_CERT_BASE64 != ''
        shell: powershell
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName | Select-Object -Last 1 -ExpandProperty FullName
          if (-not $signtool) {
            throw "signtool.exe was not found on the runner"
          }
          $cert = Join-Path $env:RUNNER_TEMP "lhcontrol-signing-cert.pfx"
          [IO.File]::WriteAllBytes($cert, [Convert]::FromBase64String($env:SIGNING_CERT_BASE64))
          try {
            & $signtool sign /v /fd SHA256 /f $cert /p $env:SIGNING_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 "build\bin\lhcontrol.exe"
            if ($LASTEXITCODE -ne 0) { throw "Failed to sign lhcontrol.exe" }

            Push-Location "build\windows\installer"
            try {
              makensis "-DARG_WAILS_AMD64_BINARY=..\..\bin\lhcontrol.exe" project.nsi
              if ($LASTEXITCODE -ne 0) { throw "makensis failed to repackage the signed installer" }
            } finally {
              Pop-Location
            }

            & $signtool sign /v /fd SHA256 /f $cert /p $env:SIGNING_CERT_PASSWORD /tr http://timestamp.digicert.com /td SHA256 "build\bin\lhcontrol-amd64-installer.exe"
            if ($LASTEXITCODE -ne 0) { throw "Failed to sign the installer" }

            & $signtool verify /pa /v "build\bin\lhcontrol.exe"
            if ($LASTEXITCODE -ne 0) { throw "lhcontrol.exe failed signature verification" }
            & $signtool verify /pa /v "build\bin\lhcontrol-amd64-installer.exe"
            if ($LASTEXITCODE -ne 0) { throw "The installer failed signature verification" }
          } finally {
            Remove-Item $cert -ErrorAction SilentlyContinue
          }

      - name: Verify and Hash Build Output
        if: steps.check_tag.outputs.skipped == 'false'
        shell: powershell
        run: |
          $version = "${{ steps.check_tag.outputs.tag_name }}".TrimStart("v")
          $files = @("build/bin/lhcontrol.exe", "build/bin/lhcontrol-amd64-installer.exe")
          foreach ($file in $files) {
            if (!(Test-Path $file) -or (Get-Item $file).Length -le 0) {
              throw "Required artifact is missing or empty: $file"
            }
          }
          $exeVersion = (Get-Item "build/bin/lhcontrol.exe").VersionInfo.FileVersionRaw.ToString()
          $installerVersion = (Get-Item "build/bin/lhcontrol-amd64-installer.exe").VersionInfo.ProductVersion
          if (!$exeVersion.StartsWith($version) -or !$installerVersion.StartsWith($version)) {
            throw "Artifact versions do not match release ${version}: exe=$exeVersion installer=$installerVersion"
          }
          Get-FileHash $files -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } |
            Set-Content "build/bin/SHA256SUMS.txt" -Encoding ascii

      - name: Upload Release Assets
        if: steps.check_tag.outputs.skipped == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_tag.outputs.tag_name }}
          files: |
            build/bin/lhcontrol.exe
            build/bin/*-installer.exe
            build/bin/SHA256SUMS.txt
